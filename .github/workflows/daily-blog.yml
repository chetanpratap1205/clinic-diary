name: Daily Autonomous Blog Publisher

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  publish-daily-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Daily Blog Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/generate-daily-blog.ts

      - name: Commit & Push Generated Article
        run: |
          git config --global user.name "Doctor Diary AI Engine"
          git config --global user.email "bot@doctordiary.in"
          git add src/lib/blog-data.ts
          if git diff --staged --quiet; then
            echo "No new blog article to commit."
          else
            git commit -m "content: publish daily AI blog article [skip ci]"
            git push origin main
          fi
